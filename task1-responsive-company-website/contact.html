<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaTech Solutions | Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="container nav-wrapper">
            <a href="index.html" class="logo">NovaTech</a>
            <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode">Dark Mode</button>
            <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">&#9776;</button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <h1 class="section-title">Contact Us</h1>
            <form class="contact-form" id="contactForm" novalidate>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name">
                    <small class="error-msg" id="nameErr"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com">
                    <small class="error-msg" id="emailErr"></small>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="4" placeholder="How can we help?"></textarea>
                    <small class="error-msg" id="msgErr"></small>
                </div>

                <button type="submit" class="btn">Send Message</button>
                <div class="success-msg" id="successBox">Message sent successfully!</div>
            </form>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="services.html">Services</a>
                <a href="contact.html">Contact</a>
            </div>
            <p>&copy; 2026 NovaTech Solutions. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
